[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disensor-cursor"
version = "0.3.0"
description = "Cursor hooks adapter for disensor: reminds the agent to close the adversarial round, without running models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nicolas Rocchia" }]
keywords = ["cursor", "hooks", "disensor", "adversarial review", "code review"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
# Sin dependencias de runtime a proposito. El adaptador habla con disensor por
# subprocess, sobre la superficie que su README declara estable (los exit codes
# de `round`, los flags documentados, las claves de disensor.config.json), asi
# que no importa nada del paquete y no se ata a su version.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
disensor-cursor = "disensor_cursor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
disensor_cursor = ["families.json"]
